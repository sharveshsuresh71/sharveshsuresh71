<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Straw Hat Shark — Jolly Roger</title>
<desc id="desc">An original friendly pirate shark wearing a straw hat, inviting you to click and discover the Jolly Roger.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071421"/><stop offset=".55" stop-color="#142B39"/><stop offset="1" stop-color="#311D32"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0A8"/><stop offset=".48" stop-color="#F4B94F"/><stop offset="1" stop-color="#C66A31"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9CE2E4"/><stop offset="1" stop-color="#3E9AAE"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1200" height="620" rx="30" fill="url(#bg)"/>
<g opacity=".3" fill="#D9F5F5"><circle cx="105" cy="95" r="2"/><circle cx="260" cy="180" r="2"/><circle cx="1010" cy="105" r="2"/><circle cx="1100" cy="430" r="2"/><circle cx="170" cy="500" r="2"/><circle cx="900" cy="530" r="2"/></g>
<path d="M0 505 Q160 465 300 505 T600 505 T900 505 T1200 505 V620 H0Z" fill="#0A1A2A" opacity=".8"/>
<path d="M0 530 Q170 490 340 530 T680 530 T1020 530 T1360 530" fill="none" stroke="#4E9FB2" stroke-width="3" opacity=".45"/>
<ellipse cx="600" cy="330" rx="225" ry="215" fill="#E9A83F" opacity=".17" filter="url(#glow)"/>
<!-- original cartoon pirate shark -->
<g transform="translate(0 10)">
 <ellipse cx="600" cy="480" rx="185" ry="24" fill="#000" opacity=".4" filter="url(#shadow)"/>
 <!-- tail and fins -->
 <path d="M435 340 Q350 285 315 320 Q350 335 354 390 Q390 370 455 395Z" fill="#397F96" stroke="#173F56" stroke-width="9"/>
 <path d="M740 365 Q825 310 870 330 Q842 355 846 410 Q800 390 735 420Z" fill="#397F96" stroke="#173F56" stroke-width="9"/>
 <path d="M530 455 Q490 500 470 520 Q530 535 575 485Z" fill="#4A9FB0" stroke="#173F56" stroke-width="8"/>
 <path d="M670 455 Q710 500 730 520 Q670 535 625 485Z" fill="#4A9FB0" stroke="#173F56" stroke-width="8"/>
 <!-- body -->
 <path d="M425 315 Q435 205 600 190 Q765 205 775 315 Q785 435 690 475 Q600 510 510 475 Q415 435 425 315Z" fill="url(#skin)" stroke="#173F56" stroke-width="11"/>
 <path d="M455 365 Q600 410 745 365 Q730 455 600 468 Q470 455 455 365Z" fill="#EAF5E9" stroke="#173F56" stroke-width="7"/>
 <!-- gills -->
 <path d="M470 325 Q460 360 475 380 M493 330 Q483 360 498 382 M516 335 Q507 362 520 383" fill="none" stroke="#28677D" stroke-width="8" stroke-linecap="round"/>
 <!-- face -->
 <ellipse cx="548" cy="330" rx="15" ry="21" fill="#102D42"/><ellipse cx="652" cy="330" rx="15" ry="21" fill="#102D42"/>
 <circle cx="553" cy="323" r="5" fill="#fff"/><circle cx="657" cy="323" r="5" fill="#fff"/>
 <path d="M555 390 Q600 423 645 390" fill="none" stroke="#173F56" stroke-width="9" stroke-linecap="round"/>
 <path d="M568 400 l10 17 10 -15 11 18 11 -18 10 15 10 -17" fill="#fff" stroke="#173F56" stroke-width="3" stroke-linejoin="round"/>
 <path d="M590 365 Q600 357 610 365" fill="none" stroke="#28677D" stroke-width="5" stroke-linecap="round"/>
 <!-- straw hat -->
 <path d="M430 235 Q445 145 600 132 Q755 145 770 235 Q700 265 600 260 Q500 265 430 235Z" fill="url(#gold)" stroke="#603A20" stroke-width="10"/>
 <path d="M405 237 Q600 210 795 237 Q780 280 600 282 Q420 280 405 237Z" fill="#E8B44D" stroke="#603A20" stroke-width="10"/>
 <path d="M438 235 Q600 253 762 235" fill="none" stroke="#FFF0A8" stroke-width="7" opacity=".75"/>
 <path d="M450 219 Q600 193 750 219" fill="none" stroke="#B97932" stroke-width="5" opacity=".7"/>
 <path d="M455 250 Q600 280 745 250" fill="none" stroke="#B82E35" stroke-width="17"/>
 <path d="M455 250 Q600 280 745 250" fill="none" stroke="#F2B24B" stroke-width="4" stroke-dasharray="9 10"/>
</g>
<!-- Jolly Roger inspired crossed cutlasses and skull emblem, original -->
<g transform="translate(600 78)" opacity=".95">
 <path d="M-55 10 L55 72 M55 10 L-55 72" stroke="#F7D58A" stroke-width="9" stroke-linecap="round"/>
 <path d="M-55 10 l-17 -20 M55 10 l17 -20" stroke="#F7D58A" stroke-width="7" stroke-linecap="round"/>
 <circle cx="0" cy="34" r="29" fill="#F4E8C9" stroke="#7B4C2C" stroke-width="5"/>
 <circle cx="-10" cy="30" r="6" fill="#173047"/><circle cx="10" cy="30" r="6" fill="#173047"/>
 <path d="M-9 49 L0 43 L9 49" fill="#173047"/>
 <path d="M-12 58 v8 M0 56 v10 M12 58 v8" stroke="#173047" stroke-width="4"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="600" y="48" fill="#E9C77F" font-size="17" font-weight="700" letter-spacing="7">THE CREW IS CALLING</text>
 <text x="600" y="565" fill="#FFF0C9" font-size="34" font-weight="900" letter-spacing="5">CLICK TO SEE MY JOLLY ROGER</text>
 <text x="600" y="596" fill="#A9C8D0" font-size="15" letter-spacing="5">FIND MY PIRATE SHIP · JOIN THE ADVENTURE</text>
</g>
<path d="M1010 265 l24 24 -24 24 M1034 289 H1080" fill="none" stroke="#F4C56F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
 <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="1.2s" repeatCount="indefinite"/>
</path>
</svg>