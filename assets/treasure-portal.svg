<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<title>Animated treasure invitation</title>
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06172d"/><stop offset=".55" stop-color="#123d58"/><stop offset="1" stop-color="#321b35"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff5b9"/><stop offset=".45" stop-color="#f8bd45"/><stop offset="1" stop-color="#a94b19"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffdf75" stop-opacity=".75"/><stop offset="1" stop-color="#ffad32" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#sea)"/>
<g fill="#d8f1ff" opacity=".65"><circle cx="70" cy="55" r="2"/><circle cx="220" cy="90" r="2"/><circle cx="1080" cy="55" r="2"/><circle cx="1140" cy="280" r="2"/><circle cx="150" cy="320" r="2"/><circle cx="900" cy="45" r="2"/></g>
<ellipse cx="600" cy="195" rx="330" ry="190" fill="url(#glow)" filter="url(#soft)"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></ellipse>
<text x="600" y="54" fill="#f8d98d" font-family="Georgia,serif" font-size="20" text-anchor="middle" letter-spacing="8">A PIRATE'S GREATEST SECRET</text>
<!-- open treasure chest -->
<g transform="translate(485 90)">
 <ellipse cx="115" cy="225" rx="190" ry="19" fill="#000" opacity=".32" filter="url(#soft)"/>
 <path d="M12 105 Q15 4 115 0 Q215 4 218 105Z" fill="#98451f" stroke="#f5c75d" stroke-width="9">
  <animateTransform attributeName="transform" type="rotate" values="0 115 105;-10 115 105;0 115 105" dur="3s" repeatCount="indefinite"/>
 </path>
 <path d="M12 105 Q115 65 218 105 L218 212 Q115 248 12 212Z" fill="#74351f" stroke="#f5c75d" stroke-width="9"/>
 <path d="M30 122 L200 122 M30 195 L200 195" stroke="#e8ad42" stroke-width="11"/>
 <rect x="99" y="122" width="32" height="77" rx="5" fill="#f4c75a" stroke="#59311d" stroke-width="5"/>
 <rect x="108" y="148" width="14" height="23" rx="5" fill="#3b261c"/>
 <path d="M115 -42 l12 31 32 11 -32 12 -12 31 -12 -31 -32 -12 32 -11Z" fill="#fff0a4"><animate attributeName="opacity" values=".15;1;.15" dur="1.2s" repeatCount="indefinite"/></path>
</g>
<g fill="url(#gold)" stroke="#8d531d" stroke-width="3">
 <circle cx="390" cy="145" r="14"><animate attributeName="cy" values="145;118;145" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="790" cy="125" r="17"><animate attributeName="cy" values="125;100;125" dur="2.3s" repeatCount="indefinite"/></circle>
 <circle cx="835" cy="255" r="12"><animate attributeName="cy" values="255;232;255" dur="1.8s" repeatCount="indefinite"/></circle>
 <circle cx="365" cy="260" r="18"><animate attributeName="cy" values="260;236;260" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="600" y="320" fill="#fff0c2" font-size="39" font-weight="900" letter-spacing="3">CLICK TO SEE MY TREASURE</text>
 <text x="600" y="356" fill="#d7c39a" font-size="16" letter-spacing="5">MY JOLLY ROGER · MY SHIP · MY WORLD</text>
</g>
<path d="M930 195 h85 m-30 -28 30 28 -30 28" fill="none" stroke="#ffd66d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;16 0;0 0" dur=".9s" repeatCount="indefinite"/></path>
</svg>