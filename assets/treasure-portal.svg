<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<title>Click to see my treasure</title>
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b36"/><stop offset=".55" stop-color="#123d58"/><stop offset="1" stop-color="#321b35"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff3ad"/><stop offset=".45" stop-color="#f8bd45"/><stop offset="1" stop-color="#b85c20"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#ffe58a" stop-opacity=".65"/><stop offset="1" stop-color="#f4a72f" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
 <clipPath id="portrait"><rect x="315" y="90" width="370" height="445" rx="30"/></clipPath>
</defs>
<rect width="1200" height="650" rx="28" fill="url(#sea)"/>
<g fill="#d9f4ff" opacity=".65">
 <circle cx="80" cy="85" r="2"/><circle cx="220" cy="175" r="2"/><circle cx="1050" cy="95" r="2"/><circle cx="1120" cy="440" r="2"/><circle cx="170" cy="540" r="2"/><circle cx="900" cy="70" r="2"/>
</g>
<ellipse cx="500" cy="300" rx="310" ry="290" fill="url(#aura)" filter="url(#blur)">
 <animate attributeName="opacity" values=".45;.95;.45" dur="3s" repeatCount="indefinite"/>
</ellipse>
<text x="600" y="55" fill="#f8d98d" font-family="Georgia,serif" font-size="22" text-anchor="middle" letter-spacing="9">THE CAPTAIN'S SECRET</text>
<!-- portrait: existing uploaded anime image -->
<rect x="305" y="80" width="390" height="465" rx="36" fill="#f3c66c" opacity=".28" filter="url(#blur)"/>
<g clip-path="url(#portrait)">
 <image href="https://raw.githubusercontent.com/sharveshsuresh71/sharveshsuresh71/main/assets/strawhat-anime.jpg" x="315" y="90" width="370" height="445" preserveAspectRatio="xMidYMid slice"/>
</g>
<rect x="315" y="90" width="370" height="445" rx="30" fill="none" stroke="url(#gold)" stroke-width="7">
 <animate attributeName="stroke-width" values="5;10;5" dur="2.2s" repeatCount="indefinite"/>
</rect>
<!-- treasure chest -->
<g transform="translate(790 260)">
 <ellipse cx="145" cy="230" rx="170" ry="22" fill="#000" opacity=".35" filter="url(#blur)"/>
 <path d="M15 95 Q15 10 145 5 Q275 10 275 95Z" fill="#9a4c24" stroke="#f3c15a" stroke-width="9">
  <animateTransform attributeName="transform" type="rotate" values="0 145 95;-8 145 95;0 145 95" dur="3s" repeatCount="indefinite"/>
 </path>
 <path d="M15 95 Q145 55 275 95 L275 205 Q145 245 15 205Z" fill="#7a351d" stroke="#f3c15a" stroke-width="9"/>
 <path d="M35 110 L255 110 M35 190 L255 190" stroke="#e7a83c" stroke-width="12"/>
 <path d="M125 105 L165 105 L165 195 L125 195Z" fill="#e8b84e" stroke="#63341e" stroke-width="5"/>
 <rect x="132" y="135" width="26" height="32" rx="7" fill="#39251b"/>
 <path d="M40 80 Q145 -5 250 80" fill="none" stroke="#ffd86c" stroke-width="5" opacity=".8"/>
 <g fill="#ffe58a">
  <path d="M145 -38 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9Z">
   <animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/>
  </path>
 </g>
</g>
<!-- orbiting coins -->
<g fill="url(#gold)" stroke="#8d531d" stroke-width="3">
 <g><circle cx="760" cy="155" r="18"/><text x="760" y="162" fill="#704018" stroke="none" font-size="20" text-anchor="middle">฿</text><animateTransform attributeName="transform" type="translate" values="0 0;12 -22;0 0" dur="2.4s" repeatCount="indefinite"/></g>
 <circle cx="1060" cy="210" r="14"><animate attributeName="cy" values="210;185;210" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="735" cy="470" r="13"><animate attributeName="cy" values="470;440;470" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="1090" cy="480" r="18"><animate attributeName="cy" values="480;450;480" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="600" y="590" fill="#fff0c2" font-size="43" font-weight="900" letter-spacing="3">CLICK TO SEE MY TREASURE</text>
 <text x="600" y="625" fill="#d7c39a" font-size="17" letter-spacing="5">MY JOLLY ROGER · MY SHIP · MY WORLD</text>
</g>
<g fill="none" stroke="#ffd66d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
 <path d="M1050 300 h72 m-28 -28 28 28 -28 28">
  <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="1s" repeatCount="indefinite"/>
 </path>
</g>
</svg>