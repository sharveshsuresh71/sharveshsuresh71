<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Sharvesh Suresh — Shark Coding</title><desc id="desc">A futuristic animated 3D-inspired developer banner with a glowing crystalline core, orbital rings, particles and developer interface panels.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b1b"/><stop offset=".52" stop-color="#10163a"/><stop offset="1" stop-color="#090d20"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cf7ff"/><stop offset=".45" stop-color="#25c8ff"/><stop offset="1" stop-color="#635bff"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2a5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3548dc"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#40dfff" stop-opacity=".45"/><stop offset="1" stop-color="#40dfff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6c8cff" stroke-opacity=".10" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="440" rx="28" fill="url(#bg)"/>
<rect width="1200" height="440" rx="28" fill="url(#grid)"/>
<circle cx="850" cy="205" r="220" fill="url(#glow)" filter="url(#blur)"/>
<path d="M0 350 Q260 280 470 390 T900 360 T1200 330" fill="none" stroke="#3c64ff" stroke-opacity=".15" stroke-width="1"/>
<!-- ambient particles -->
<g fill="#8beeff">
 <circle cx="690" cy="74" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="94" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="1010" cy="350" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="780" cy="390" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
 <circle cx="580" cy="180" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
<!-- left content -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <rect x="62" y="56" width="150" height="28" rx="14" fill="#17234b" stroke="#4b8dff" stroke-opacity=".6"/>
 <circle cx="80" cy="70" r="4" fill="#45e5ff"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
 <text x="94" y="75" font-size="11" letter-spacing="2.2" fill="#a8c8ff">DEVELOPER PROFILE</text>
 <text x="60" y="160" font-size="54" font-weight="800" letter-spacing="-1.8" fill="#ffffff">SHARVESH</text>
 <text x="60" y="220" font-size="54" font-weight="800" letter-spacing="-1.8" fill="url(#cyan)">SURESH</text>
 <rect x="62" y="244" width="74" height="3" rx="2" fill="url(#cyan)"/>
 <text x="62" y="281" font-size="17" fill="#d5defb" letter-spacing="1.1">FULL-STACK DEV  ·  AI BUILDER</text>
 <text x="62" y="309" font-size="17" fill="#9daedb" letter-spacing="1.1">SECURITY ENTHUSIAST</text>
 <text x="62" y="365" font-size="13" fill="#7185b7" letter-spacing="2.5">BUILD  /  BREAK  /  LEARN  /  REPEAT</text>
</g>
<!-- orbital system -->
<g transform="translate(875 216)">
 <ellipse rx="178" ry="62" fill="none" stroke="#4c7dff" stroke-opacity=".5" stroke-width="1.5" transform="rotate(-24)">
  <animateTransform attributeName="transform" type="rotate" from="-24" to="336" dur="24s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="154" ry="92" fill="none" stroke="#a66bff" stroke-opacity=".48" stroke-width="1.4" transform="rotate(52)">
  <animateTransform attributeName="transform" type="rotate" from="52" to="-308" dur="30s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse rx="190" ry="116" fill="none" stroke="#37dfff" stroke-opacity=".18" stroke-dasharray="3 9" stroke-width="1" transform="rotate(12)">
  <animateTransform attributeName="transform" type="rotate" from="12" to="372" dur="42s" repeatCount="indefinite"/>
 </ellipse>
 <circle r="112" fill="url(#glow)"/>
 <!-- floating central crystal / cube -->
 <g filter="url(#shine)">
  <animateTransform attributeName="transform" type="translate" values="0 -8;0 8;0 -8" dur="4s" repeatCount="indefinite"/>
  <path d="M0 -82 L72 -42 L72 42 L0 84 L-72 42 L-72 -42Z" fill="#14265b" stroke="#6feaff" stroke-width="2"/>
  <path d="M0 -82 L0 0 L-72 -42Z" fill="#39d9ff" fill-opacity=".72" stroke="#9af6ff" stroke-width="1"/>
  <path d="M0 -82 L72 -42 L0 0Z" fill="#7667ff" fill-opacity=".85" stroke="#b3a4ff" stroke-width="1"/>
  <path d="M-72 -42 L0 0 L-72 42Z" fill="#1d68bd" fill-opacity=".9" stroke="#6feaff" stroke-width="1"/>
  <path d="M72 -42 L0 0 L72 42Z" fill="#583dc2" fill-opacity=".9" stroke="#b3a4ff" stroke-width="1"/>
  <path d="M-72 42 L0 0 L0 84Z" fill="#153e83" stroke="#56dfff" stroke-width="1"/>
  <path d="M72 42 L0 0 L0 84Z" fill="#302a88" stroke="#a18aff" stroke-width="1"/>
  <path d="M-24 -14 L0 -29 L24 -14 L24 14 L0 29 L-24 14Z" fill="#d7fbff" fill-opacity=".13" stroke="#c5fbff" stroke-opacity=".8"/>
  <text x="0" y="6" font-family="Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#ffffff">S</text>
 </g>
 <!-- orbiting nodes -->
 <g>
  <circle cx="-164" cy="-12" r="7" fill="#63eaff" filter="url(#shine)"/>
  <circle cx="153" cy="-65" r="6" fill="#b28aff" filter="url(#shine)"/>
  <circle cx="82" cy="103" r="5" fill="#65eaff" filter="url(#shine)"/>
 </g>
</g>
<!-- floating glass HUD cards -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <g transform="translate(690 62)">
  <rect width="132" height="54" rx="12" fill="url(#glass)" stroke="#69dfff" stroke-opacity=".55"/>
  <circle cx="18" cy="19" r="5" fill="#42e6ff"/><text x="31" y="23" font-size="10" fill="#d9faff" letter-spacing="1">AI SYSTEM</text>
  <text x="18" y="42" font-size="10" fill="#819acb">EXPLORING IDEAS</text>
 </g>
 <g transform="translate(1004 270)">
  <rect width="138" height="58" rx="12" fill="url(#glass)" stroke="#a58aff" stroke-opacity=".55"/>
  <path d="M17 17h13M17 23h20M17 29h9" stroke="#bda8ff" stroke-width="2" stroke-linecap="round"/>
  <text x="47" y="23" font-size="10" fill="#eee6ff" letter-spacing="1">CODE MODE</text>
  <text x="17" y="47" font-size="10" fill="#9ba9d2">CREATING / TESTING</text>
 </g>
</g>
<!-- bottom scan line -->
<path d="M40 410 H1160" stroke="#4c6fff" stroke-opacity=".25"/>
<path d="M40 410 H260" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round">
 <animate attributeName="d" values="M40 410 H150;M40 410 H520;M40 410 H150" dur="6s" repeatCount="indefinite"/>
</path>
</svg>
